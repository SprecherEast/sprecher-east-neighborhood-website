name: Bug
description: Something is broken or behaves wrongly.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Describe the problem. The fix itself goes in the pull request that closes this issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong? Include what you expected and what actually happens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Proposed fix
      description: Your current idea for the fix (optional; the PR has the final version).
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is fixed?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely touched
      description: The paths or areas this will edit, so two issues that overlap are not worked on at the same time. Groomers fill it in when unknown.
  - type: textarea
    id: avoid
    attributes:
      label: Must not touch
      description: Files or areas to leave alone, such as shared code another open issue is changing.
  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: Anything that needs an answer before or during the work. A question only the owner can answer gets the `needs owner` label.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which parts of the project does this touch? Each choice becomes a label.
      multiple: true
      options:
        - frontend
        - cms
        - auth
        - styling
        - ux
        - ci
        - infra
        - config
        - dependencies
        - tooling
        - migration
        - graphify
        - visualization
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - high
        - medium
        - low
    validations:
      required: true
