name: Planner Board

# Keeps the organization board in step with the work (#941, #1089), signed in as the "Sprecher East
# Planner" app. A new or reopened issue goes into the sprint that is running; an assigned issue,
# which is how work is claimed, also becomes In progress; the "ready" label moves a card between
# Backlog and Ready, and only while the issue passes the issue check and does not wait for the
# owner. The check's own label changes start no workflow (GITHUB_TOKEN), so this one runs the
# check's rules itself on every change to the issue. In review and Done are GitHub's own board
# rules. Run it by hand with an issue number to bring one card in line with its issue. It checks
# out and runs only the repository's own main-branch code. Issue text is untrusted: it goes only
# through the pure rule functions, and the label name is an environment variable compared with
# fixed names; neither reaches a shell.

on:
  issues:
    types: [opened, reopened, assigned, labeled, unlabeled, edited, milestoned, demilestoned]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to bring in line with its labels and assignee
        required: true
        type: string

permissions:
  contents: read

# Work runs (opened, reopened, assigned) queue apart from the others, so the labels a form adds
# cannot push a waiting work run out of the queue (GitHub keeps one waiting run per group). The
# others read the issue as it is, so the last one to run is enough.
concurrency:
  group: planner-board-${{ github.event.issue.number || inputs.issue }}-${{ contains(fromJSON('["opened","reopened","assigned"]'), github.event.action) && 'work' || 'state' }}
  cancel-in-progress: false

jobs:
  board:
    name: Move the card
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /scripts/
            /.github/scripts/
            /.github/label-policy.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Get a short-lived token as the app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PLANNER_APP_ID }}
          private-key: ${{ secrets.PLANNER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read
          permission-organization-projects: write

      - name: Put the card where the work is
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          ACTION: ${{ github.event.action || 'sync' }}
          LABEL: ${{ github.event.label.name }}
        run: node scripts/planner-board.mjs
