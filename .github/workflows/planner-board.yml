name: Planner Board

# Keeps the organization board in step with the work (#941, #1089, #1435), signed in as the "Sprecher
# East Planner" app. When an event concerns an issue (opened, reopened, assigned, labeled, unlabeled,
# edited, milestoned, demilestoned), the app reads that issue's facts, sets its card to the status the
# one status rule gives (docs/process/board-status-rule.md) and, for a move GitHub's own board
# workflows do not make, edits the issue's "Board status" comment with the reason. It moves only that
# issue's card and changes no label or assignee. Label changes made by other workflows start no run
# (GITHUB_TOKEN), so the next event or a manual run catches up. Run it by hand with an issue number to
# bring one card in line with the rule. It checks out and runs only the repository's own code. Issue
# text is untrusted: it goes only through the pure rule functions, and the issue number is checked to
# be digits before it is used; neither reaches a shell. What each job may write: "Move the card" writes
# the Status field and the one comment (issues: write, organization projects: write); "Report where
# the board differs" (#1425) reads every open card, prints the ones that differ from the rule in the
# job summary, has no schedule and holds read access only.

on:
  issues:
    types: [opened, reopened, assigned, labeled, unlabeled, edited, milestoned, demilestoned]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number whose card to bring in line with the status rule (not needed for the report)
        required: false
        type: string
      report:
        description: Report only (#1425), no issue number needed - lists the cards that differ from the status rule and changes nothing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Work runs (opened, reopened, assigned) queue apart from the others, so the labels a form adds
# cannot push a waiting work run out of the queue (GitHub keeps one waiting run per group). The
# others read the issue as it is, so the last one to run is enough.
concurrency:
  group: planner-board-${{ inputs.report && 'report' || github.event.issue.number || inputs.issue }}-${{ contains(fromJSON('["opened","reopened","assigned"]'), github.event.action) && 'work' || 'state' }}
  cancel-in-progress: false

jobs:
  board:
    name: Move the card
    if: ${{ !inputs.report && (github.event_name != 'workflow_dispatch' || inputs.issue != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /scripts/
            /.github/scripts/
            /.github/label-policy.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Get a short-lived token as the app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PLANNER_APP_ID }}
          private-key: ${{ secrets.PLANNER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-organization-projects: write

      - name: Put the card where the work is
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          ACTION: ${{ github.event.action || 'sync' }}
        run: node scripts/planner-board.mjs

  report:
    name: Report where the board differs
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.report }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *checkout

      - name: Get a short-lived token as the app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PLANNER_APP_ID }}
          private-key: ${{ secrets.PLANNER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read
          permission-organization-projects: read

      - name: Print the cards that differ from the rule
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/planner-report.mjs
