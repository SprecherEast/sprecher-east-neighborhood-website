name: Pull request preview

# Builds a pull request that carries the `preview` label and puts it live at
# https://pr-<number>.dev.sprechereast.com, with one comment on the pull request that holds the link
# (#1075, epic #1070; the design and its limits are in ops/previews.md), and takes the preview down when the
# pull request closes, merged or not (#1076). The nightly sweep is preview-sweep.yml. Not a required check: a failed
# preview never blocks a merge or the production deploy.
#
# `pull_request`, never `pull_request_target`, which would run with the base repository's secrets. A
# pull request from a fork or from Dependabot gets no secrets and a read-only token, so the gate ends
# green with a note saying why. For a same-repository pull request this file is the pull request's own
# copy, so what holds the line is the server: the `preview` environment holds only the restricted preview
# account's key, which can run the wrapper's six actions and nothing else (ops/previews.md).
#
# Three kinds of job, so the key never sits beside code nobody has reviewed:
#   gate, build   no environment, no secret; build runs the pull request's npm install scripts
#   facts, deploy, teardown
#                 the `preview` environment (the key); they check out the default branch's scripts,
#                 never the pull request's or its base's (a stacked pull request's base is another unreviewed
#                 branch), and never unpack or run the build: it is listed, and sent to the server on stdin
#   report, removed
#                 a write token for the pull request comment, and nothing else
# No job names `production`, and none calls a privileged workflow: the wrapper's deploy prints values from
# the release into this public log.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]

permissions:
  contents: read

jobs:
  gate:
    name: Pull request preview gate
    # (a closed pull request builds nothing: the `teardown` job takes its preview down)
    if: github.event.action != 'closed' && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    # A newer push replaces an older run's gate; a label other than `preview` only skips it and gets a group
    # of its own, so it never cancels anything.
    concurrency:
      group: pull-request-preview-gate-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && format('-other-label-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      showcase: ${{ steps.plan.outputs.showcase }} # also build the component showcase into the preview (#1459)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to compare with the commit the pull request branched from
          persist-credentials: false

      - name: Decide whether this pull request gets a preview
        id: plan
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'preview') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/plan-preview.sh

  facts:
    name: Preview server facts
    needs: gate
    if: needs.gate.outputs.build == 'true'
    environment: preview # the preview key and connection values
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      available: ${{ steps.facts.outputs.available }}
      node: ${{ steps.facts.outputs.node }}
    steps:
      # the default branch's scripts, never the pull request's or its base's: a stacked pull request's base is
      # another unreviewed branch (this job holds the key)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/preview-ssh
        id: ssh
        with:
          host: ${{ secrets.PREVIEW_SSH_HOST }}
          user: ${{ secrets.PREVIEW_SSH_USER }}
          port: ${{ secrets.PREVIEW_SSH_PORT || '22' }}
          key: ${{ secrets.PREVIEW_SSH_KEY }}
          known-hosts: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}

      - name: Read the server's Node version, through the preview account
        id: facts
        env:
          VALUES_SET: ${{ steps.ssh.outputs.ready }}
        run: bash .github/scripts/preview-facts.sh

  build:
    name: Build preview
    needs: [gate, facts]
    if: needs.facts.outputs.available == 'yes'
    concurrency:
      group: pull-request-preview-build-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'preview' && format('-other-label-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04 # the server runs Ubuntu 24.04 too
    timeout-minutes: 30
    # No environment and no secret in this job: it runs the pull request's npm install scripts.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false # npm install scripts run in this job

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.facts.outputs.node }}
          cache: npm

      # The preview's own address, folder and Turnstile test site key come from ops/environment.sh, the
      # file the server reads too. The deploy refuses a build whose public settings differ from the
      # preview's own.
      - name: Build
        env:
          PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          NODE_VERSION: ${{ needs.facts.outputs.node }}
          # A pull request that changes a story, a shared component or the showcase's settings gets the
          # showcase built into the release's public/ folder (#1459): the preview's own app serves it at
          # /showcase/index.html, behind the same noindex headers, and it goes with the preview's folder.
          # Required: a showcase that does not build fails this build and says so in the comment.
          SHOWCASE_DEST: ${{ needs.gate.outputs.showcase == 'true' && 'public/showcase' || '' }}
          OUT: ${{ runner.temp }}/release.tar.gz
        run: |
          set -euo pipefail
          . ops/environment.sh
          export RELEASE_DIR="$APP_DIR/releases/$SHA"
          export NEXT_PUBLIC_SERVER_URL="$SITE_URL"
          export NEXT_PUBLIC_TURNSTILE_SITE_KEY="$PREVIEW_TURNSTILE_SITE_KEY"
          export TURNSTILE_PAIRED=yes
          bash ops/build-release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: preview-release
          path: ${{ runner.temp }}/release.tar.gz
          retention-days: 1
          compression-level: 0 # already gzipped

  deploy:
    name: Deploy preview
    needs: [gate, facts, build]
    if: needs.build.result == 'success'
    # Never cancelled: a cancel in the middle of the deploy over ssh could leave the wrapper's checks unrun or two
    # deploys of one preview overlapping (the deploy script has no lock). A newer push's deploy waits its turn,
    # and replaces only a deploy that is still waiting.
    concurrency:
      group: pull-request-preview-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment: preview # the preview key and connection values
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      result: ${{ steps.deploy.outputs.result }}
      url: ${{ steps.deploy.outputs.url }}
      cap: ${{ steps.deploy.outputs.cap }}
      holders: ${{ steps.deploy.outputs.holders }}
    steps:
      # the default branch's scripts, never the pull request's or its base's: a stacked pull request's base is
      # another unreviewed branch (this job holds the key)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The build is only a file to send: it is never unpacked or run here.
      - uses: actions/download-artifact@v8
        with:
          name: preview-release
          path: ${{ runner.temp }}

      - uses: ./.github/actions/vps-ssh
        with:
          host: ${{ secrets.PREVIEW_SSH_HOST }}
          user: ${{ secrets.PREVIEW_SSH_USER }}
          port: ${{ secrets.PREVIEW_SSH_PORT || '22' }}
          key: ${{ secrets.PREVIEW_SSH_KEY }}
          known-hosts: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}

      - name: Put the preview live, through the wrapper
        id: deploy
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ARCHIVE: ${{ runner.temp }}/release.tar.gz
        run: bash .github/scripts/preview-deploy.sh

  report:
    name: Pull request preview comment
    needs: [gate, facts, build, deploy]
    # Not for a run that a newer push superseded (its build or deploy was cancelled): the newer run reports.
    if: ${{ !cancelled() && needs.gate.outputs.build == 'true' && needs.build.result != 'cancelled' && needs.deploy.result != 'cancelled' }}
    # One report at a time per pull request, none cancelled, so two runs can't each create the comment.
    concurrency:
      group: pull-request-preview-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the one comment, and nothing else
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/github-script@v9
        env:
          AVAILABLE: ${{ needs.facts.outputs.available }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.outputs.result }}
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
          CAP: ${{ needs.deploy.outputs.cap }}
          HOLDERS: ${{ needs.deploy.outputs.holders }}
          SHOWCASE: ${{ needs.gate.outputs.showcase }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { pathToFileURL } = require('url');
            const { commentBody, findStickyComment, previewState, utcMinutes } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-comment.mjs`).href
            );
            const number = context.payload.pull_request.number;
            const state = previewState({
              available: process.env.AVAILABLE,
              buildResult: process.env.BUILD_RESULT,
              deployResult: process.env.DEPLOY_RESULT,
            });
            const body = commentBody({
              state,
              number,
              sha: process.env.HEAD_SHA,
              url: process.env.DEPLOY_URL,
              cap: process.env.CAP,
              holders: process.env.HOLDERS,
              showcase: process.env.SHOWCASE,
              time: utcMinutes(new Date()),
              runUrl: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = findStickyComment(comments);
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            }
            core.notice(`Pull request preview: ${state}`);

  # When the pull request closes, merged or not: the preview is taken down (#1076). For a pull request closed by
  # merging, the run's ref is the base branch; this job names only `preview`, as the others do. Only a pull request
  # of this repository can have had a preview (a fork's or Dependabot's run gets no secrets).
  teardown:
    name: Remove preview
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    # The same group as this pull request's deploy, never cancelled: a deploy in progress finishes first, and a
    # deploy still waiting is replaced by this removal, so a closed pull request is not put live after it.
    concurrency:
      group: pull-request-preview-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    environment: preview # the preview key and connection values
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      removed: ${{ steps.teardown.outputs.removed }}
    steps:
      # the default branch's scripts, never the pull request's or its base's (this job holds the key)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Without every connection value there is nothing to remove (previews are unavailable): no failure to report.
      - uses: ./.github/actions/preview-ssh
        id: ssh
        with:
          host: ${{ secrets.PREVIEW_SSH_HOST }}
          user: ${{ secrets.PREVIEW_SSH_USER }}
          port: ${{ secrets.PREVIEW_SSH_PORT || '22' }}
          key: ${{ secrets.PREVIEW_SSH_KEY }}
          known-hosts: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}

      - name: Take the preview down, through the wrapper
        id: teardown
        if: steps.ssh.outputs.ready == 'true'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/preview-teardown.sh

  removed:
    name: Pull request preview comment (removed)
    needs: teardown
    if: needs.teardown.outputs.removed == 'yes'
    concurrency:
      group: pull-request-preview-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # the one comment, and nothing else
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Only the comment the preview already has is edited: a pull request that never had one gets none.
      - uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { pathToFileURL } = require('url');
            const { commentBody, findStickyComment, utcMinutes } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/preview-comment.mjs`).href
            );
            const number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = findStickyComment(comments);
            if (!existing) return;
            const body = commentBody({
              state: 'removed',
              number,
              sha: process.env.HEAD_SHA,
              time: utcMinutes(new Date()),
              runUrl: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            core.notice('Pull request preview: removed');
