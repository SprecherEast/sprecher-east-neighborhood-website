name: Lint

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # Daily 6 AM UTC — catch newly disclosed CVEs

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prettier always runs — it checks markdown, YAML, and JSON formatting too
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier formatting
        run: npx prettier --check .

  # What agents load at session start stays under its token budget, and the generated rules match
  # the guidelines they copy (#144, #737). Installs dependencies for the offline token counter.
  agent-context:
    name: Agent context
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the generated rules and the session-start budget
        run: node scripts/agent-context.mjs

  # ESLint skipped for docs-only changes (no JS/TS to lint)
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - '*.config.*'
              - 'tsconfig.json'

      - name: Setup Node.js
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: npm ci

      - name: Run ESLint
        if: steps.filter.outputs.code == 'true'
        run: npx eslint . --max-warnings=10

  # Dependency audit: runs every step on every PR, every push to main and the daily schedule. It
  # has no path filter: a skipped step counts as success, so a filtered audit passed without
  # auditing (#868). The deploy waits for this job (.github/scripts/require-checks.sh).
  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit for critical/high vulnerabilities
        run: npm audit --audit-level=high --omit=dev
