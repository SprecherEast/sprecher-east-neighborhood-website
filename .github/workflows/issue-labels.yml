name: Issue Labels

# Turns the Type / Area / Priority answers of an issue form into labels, so every
# issue carries the labels AGENTS.md requires. Allowed values: .github/label-policy.json

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-labels-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply labels from issue form
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { pathToFileURL } = require('url');
            const scripts = (name) => import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/${name}`).href);
            const { dropLabel, ensureLabel } = await scripts('labels.mjs');
            const { formChoices } = await scripts('issue-form.mjs');
            const { PRIORITY_PREFIX, labelNames } = await scripts('pr-body.mjs');
            const policy = JSON.parse(fs.readFileSync('.github/label-policy.json', 'utf8'));
            const issue = context.payload.issue;
            const current = labelNames(issue);

            // The form's answers (issue-form.mjs): only values that are all valid options count, so a
            // heading typed inside a free-text answer can't spoof a dropdown
            const { type, areas, priority } = formChoices(issue.body, policy);

            const add = new Set(areas);
            const remove = [];
            if (type) {
              add.add(type);
              remove.push(...current.filter((l) => policy.types.includes(l) && l !== type));
            }
            if (priority) {
              const name = `${PRIORITY_PREFIX}${priority}`;
              await ensureLabel(github, context.repo, { name, color: policy.priorities[priority] });
              add.add(name);
              remove.push(...current.filter((l) => l.startsWith(PRIORITY_PREFIX) && l !== name));
            }

            for (const name of remove) {
              await dropLabel(github, { ...context.repo, issue_number: issue.number }, name);
            }
            if (add.size === 0) {
              core.info('No issue-form answers found; nothing to label.');
              return;
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: [...add] });
            core.info(`Labels applied: ${[...add].join(', ')}${remove.length ? `; removed: ${remove.join(', ')}` : ''}`);

  # Checks the issue once the labels above are on it (#969): warns with one comment and the
  # `needs grooming` label. Issue Policy also starts by itself when a person changes a label or
  # the milestone.
  groom:
    name: Check the issue
    needs: label
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/issue-policy.yml
