name: CI

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files via the API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check & Build
    runs-on: ubuntu-latest

    # The job always runs so "Type-check & Build" always reports a result
    # (it is a required check on main). Docs-only changes skip the heavy steps.
    steps:
      - uses: actions/checkout@v6

      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.agents/**'
              - '!docs/**'
              - '!.env.local.example'
              - '!LICENSE'

      - uses: actions/setup-node@v6
        if: steps.filter.outputs.code == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: npm ci

      # `next typegen` writes the route types in .next/types (page, layout and route handler props),
      # which tsconfig.json includes, so `tsc` checks them too (#248)
      - name: Type-check
        if: steps.filter.outputs.code == 'true'
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Unit tests
        if: steps.filter.outputs.code == 'true'
        run: npm test

      - name: Create database tables
        if: steps.filter.outputs.code == 'true'
        run: npx payload migrate
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-build-placeholder-secret-32chars!' }}
          DATABASE_URI: file:./data/payload.db
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

      - name: Build
        if: steps.filter.outputs.code == 'true'
        run: npm run build
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-build-placeholder-secret-32chars!' }}
          DATABASE_URI: file:./data/payload.db
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  # The intelligence agents' prompts, sources, schemas and eval cases (#337): validated against
  # their JSON Schemas, and every field a prompt names must exist. Then the runner's tests, which
  # run the scout and submit evals as code, and an audit of its own dependencies (#364). Skipped
  # when they're untouched.
  intelligence:
    name: Intelligence check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            intelligence:
              - 'intelligence/**'
              - 'scripts/check-intelligence.mjs'
              - 'package-lock.json'

      - uses: actions/setup-node@v6
        if: steps.filter.outputs.intelligence == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            intelligence/runner/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.intelligence == 'true'
        run: npm ci

      - name: Check intelligence/
        if: steps.filter.outputs.intelligence == 'true'
        run: node scripts/check-intelligence.mjs

      - name: Runner tests and audit
        if: steps.filter.outputs.intelligence == 'true'
        working-directory: intelligence/runner
        run: |
          npm ci
          npm test
          npm audit --audit-level=high --omit=dev

  # Files, exports and packages nothing uses (#445). Not a required check yet, and the deploy
  # doesn't wait for it; it becomes required once it has stayed green on main for a while.
  knip:
    name: Unused code (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Node 22: on Node 20 knip exits 13 at random (#455)
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Knip
        run: npm run knip

  # Copy-pasted code: a block of 12+ lines repeated anywhere in the code fails the
  # PR (#611, guard rail 1). Settings and ignore list in `.jscpd.json`. Not a required check yet;
  # it becomes required once it has stayed green on main for a while.
  duplication:
    name: Duplicate code (jscpd)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: jscpd
        run: npm run duplication

  # The generated reference pages match the code (#714, decision 0019 §6): the content-type pages in
  # docs/reference/content-types/ are regenerated from the Payload config and the job fails on any
  # difference, so a content type can't change without its page. It loads the config only: no
  # database, no server. The run time goes to the job summary. Required on `main` once #716 merges.
  knowledge-sync:
    name: Knowledge sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the generated content-type pages
        run: |
          start=$(date +%s)
          npm run docs:check
          echo "docs:check took $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

  # The account and contact flows as a resident uses them, on a phone and a desktop (#311):
  # Playwright against a production build with a fresh database, emails caught by a local SMTP
  # server and the robot check off (e2e/serve.mjs). Not a required check yet, and the deploy
  # doesn't wait for it; the ruleset change that requires it is the owner's step (#868).
  #
  # The job always runs so "End-to-end tests" always reports a result: a skipped job counts as
  # passing and could hide a failure. A step decides whether the rest run (.github/scripts/e2e-gate.mjs):
  # always on a push to main, on a pull request that changes the UI (comment-only and
  # formatting-only edits, tests and docs don't count) unless its description holds a written
  # "End-to-end exemption", or when the tests themselves change. If the step fails, they run.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Decide whether the browser tests are due
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/e2e-gate.mjs

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.run != 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run != 'false'
        run: npm ci

      - name: Install the browser
        if: steps.gate.outputs.run != 'false'
        run: npx playwright install --with-deps chromium

      - name: Run the flows
        if: steps.gate.outputs.run != 'false'
        run: npx playwright test

      - name: Keep the report
        if: failure() && steps.gate.outputs.run != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Pushes to main deploy once the build above has passed; the deploy also waits for the Lint
  # checks (#245). Pull requests skip this job.
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
