name: PR Policy

# Enforces AGENTS.md steps 1–2 on every pull request: it closes exactly one issue, that issue is
# claimed (assigned), planned (milestone), labeled (one type, an area, a priority) and groomed (no
# `needs grooming` label), the issue
# shows the PR on its timeline, the PR description is fully filled in, a knowledge note is updated
# with the code it describes (.github/scripts/knowledge-sync.mjs), and any end-to-end exemption has
# a reason of 20+ characters (.github/scripts/e2e-gate.mjs, #868). Each failure starts with a
# stable rule ID (PR-CLOSES, PR-LINKED, ...; the rules are in .github/scripts/pr-body.mjs, #970).
# Required status check on main ("PR Policy"). Allowed labels: .github/label-policy.json
#
# Note: this runs the PR's own copy of this file. Changes to it (or to any workflow)
# are policy changes and must be called out in review (see .agents/skills/pr-review).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The whole tree: the knowledge check looks for each note named in docs/knowledge/map.json
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const { pathToFileURL } = require('url');
            const scripts = (name) => import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/${name}`).href);
            const {
              closeProblems,
              descriptionProblems,
              groomedProblems,
              isDependabot,
              issueProblems,
              linkedIssues,
              lookupProblems,
              ruleMessage,
              timelineShowsPr,
              withoutComments,
              withRuleId,
            } = await scripts('pr-body.mjs');
            if (isDependabot(pr)) {
              core.info('Dependabot PR: exempt from the issue/description rules (AGENTS.md). Checks and review still apply.');
              return;
            }

            const fs = require('fs');
            const policy = JSON.parse(fs.readFileSync('.github/label-policy.json', 'utf8'));
            const problems = [];
            const { changedFiles, knowledgeProblems } = await scripts('knowledge-sync.mjs');
            const { e2eDecision, e2eProblems } = await scripts('e2e-gate.mjs');
            const body = withoutComments(pr.body);

            // 1. The issue: the PR closes exactly one (PR-CLOSES), which is labeled (PR-LABELS), claimed
            // (PR-ASSIGNED), in the plan (PR-MILESTONE; an epic is optional) and shows this PR on its
            // timeline (PR-LINKED). A "Part of" link no longer counts (AGENTS.md, one issue, one PR).
            const links = linkedIssues(body);
            problems.push(...closeProblems(links));
            for (const number of links.closes) {
              let issue = null;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number }));
              } catch {
                // lookupProblems reports it as not found
              }
              const lookup = lookupProblems(number, issue);
              problems.push(...lookup);
              if (lookup.length) continue;
              problems.push(...issueProblems(number, issue, policy));
              // The label is read from the issue just fetched, so one the issue check removed is gone (PR-GROOMED)
              problems.push(...groomedProblems(number, issue));

              // GitHub adds the closing keyword to the issue's timeline a moment after the PR is saved,
              // so look a few times before calling the link one-way
              let linked = false;
              for (let attempt = 0; attempt < 4 && !linked; attempt++) {
                if (attempt > 0) await new Promise((resolve) => setTimeout(resolve, 5000));
                const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                  ...context.repo,
                  issue_number: number,
                  per_page: 100,
                });
                linked = timelineShowsPr(events, pr.number);
              }
              if (!linked)
                problems.push(
                  ruleMessage('PR-LINKED', `Issue #${number} does not show this PR on its timeline; check the number in "Closes #${number}", then edit the PR description to re-run.`),
                );
            }

            // 2. Every template section filled in (PR-SECTIONS, PR-SELF-REVIEW)
            problems.push(...descriptionProblems(body));

            // 3. The knowledge layer stays in sync with the code (decision 0019 section 6, #716, #770):
            // a behavior-bearing change anywhere in the repository changes a doc (and the mapped note,
            // where there is one), or says "Behavior change: none" and why; a doc the description
            // names must be in the diff
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            problems.push(
              ...withRuleId(
                'PR-KNOWLEDGE',
                knowledgeProblems({
                  mapJson: fs.readFileSync('docs/knowledge/map.json', 'utf8'),
                  files: changedFiles(files),
                  noteExists: (note) => fs.existsSync(note),
                  body,
                }),
              ),
            );

            // 4. The browser tests (#868): a UI change runs them in CI ("End-to-end tests"), unless the
            // description holds "End-to-end exemption: <reason>"; the reason needs 20+ characters and
            // the independent reviewer checks it against the diff. Shown here so the verdict is on record
            problems.push(...withRuleId('PR-E2E', e2eProblems({ body })));
            const e2e = e2eDecision({ event: 'pull_request', files: changedFiles(files), body });
            core.info(`e2e-gate: decision=${e2e.run ? 'run' : 'skip'} ui_files=${e2e.ui.length} flow_files=${e2e.flows.length} reason="${e2e.reason}"`);

            if (problems.length) {
              core.setFailed(
                `This PR does not meet AGENTS.md yet:\n- ${problems.join('\n- ')}\n\n` +
                  'Each line starts with its rule ID (docs/process/project-management.md#the-pull-request-gate). Fix the issue or the PR description, then edit the PR (or re-run this check).',
              );
            } else {
              core.info(`PR Policy passed. Closes: ${links.closes.map((n) => '#' + n).join(', ')}`);
            }
