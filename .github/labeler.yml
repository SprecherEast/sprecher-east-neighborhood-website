# Area labels and markers only, from the changed paths. Never add a type label here: a pull
# request has exactly one type (.github/label-policy.json), set by the author from the issue, and
# scripts/labeler-config.test.mjs fails if a rule here is named after one.

frontend:
  - changed-files:
      - any-glob-to-any-file:
          ['src/app/**', 'src/modules/*/ui/**', 'src/platform/ui/**', 'src/platform/richtext/**']

cms:
  - changed-files:
      - any-glob-to-any-file:
          [
            'src/payload.config.ts',
            'src/modules/*/cms/**',
            'src/platform/payload/**',
            'src/app/(payload)/**',
          ]

auth:
  - changed-files:
      - any-glob-to-any-file: ['src/modules/accounts/**', 'src/modules/verification/**']

ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', 'package-lock.json', '.npmrc']

styling:
  - changed-files:
      - any-glob-to-any-file:
          ['src/app/(frontend)/globals.css', 'tailwind.config.*', 'postcss.config.*']

config:
  - changed-files:
      - any-glob-to-any-file:
          ['*.config.*', '.prettierrc', '.eslintrc*', 'eslint.config.*', 'tsconfig.json']

# A "watch out" marker (#447): the change reaches every page that uses this code
shared-component:
  - changed-files:
      - any-glob-to-any-file:
          [
            'src/platform/ui/**',
            'src/platform/richtext/**',
            'src/platform/theme/**',
            'src/themes/**',
            'src/platform/lib/**',
            'src/platform/turnstile/**',
            'src/app/(frontend)/globals.css',
            'src/app/(frontend)/layout.tsx',
            'src/modules/site/ui/SiteHeader*',
            'src/modules/site/ui/HeaderNav*',
            'src/modules/site/ui/SiteFooter*',
            'src/modules/site/ui/Logo*',
          ]
