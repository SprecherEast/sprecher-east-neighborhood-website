# Curate eval cases for the City's police incident reports (#993): the bar in coverage.md, "Public
# interest and context", rule 6. Every item is held for a person whatever the answer (safety.yaml;
# runner/lib/gate.mjs), so no case accepts. Synthetic items; hashes are placeholders.
version: 1
asOf: '2026-11-25'
stage: curate
cases:
  - id: police-serious-and-actionable-inside
    stage: curate
    tags: [police, safety, bar]
    input:
      sourceId: madison-police-incident-reports
      externalId: madison-police-incident-reports:https://www.cityofmadison.com/police/incident-reports/2026-11-19/armed-carjacking
      contentHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      kind: news
      title: Armed carjacking
      sourceText: 7000 block Littlemore Dr, Officers responded after a caller reported a car taken at gunpoint. The suspect and the car were not found. The Persons Crime Unit is investigating.
      startsAt: null
      locationText: 7000 block Littlemore Dr
      change: new
    known: null
    expected: { decision: needs-review, coverage: core, safety: true, route: reportItem }
    graders:
      - { check: equals, field: $.safety, value: true }
      - { check: notContains, field: $.decision, value: accept }
      - check: model
        rubric: >-
          The reasons say why it is serious and what the report does not show (no suspect, no
          pattern), say the place is a block, and do not name a person or state any detail the
          report does not give. An editor decides.
    why: Inside the area and serious, so it reaches the editor, and never as a suggestion.
  - id: police-ordinary-property-loss-inside
    stage: curate
    tags: [police, safety, bar]
    input:
      sourceId: madison-police-incident-reports
      externalId: madison-police-incident-reports:https://www.cityofmadison.com/police/incident-reports/2026-11-20/shoplifting
      contentHash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      kind: news
      title: Man leaves a store without paying
      sourceText: 7000 block Littlemore Dr, A man took snacks from a store and left before officers arrived. No one was hurt and the man is known to police.
      startsAt: null
      locationText: 7000 block Littlemore Dr
      change: new
    known: null
    expected: { decision: reject, coverage: core, safety: true, route: none }
    graders:
      - { check: equals, field: $.decision, value: reject }
    why: Inside the area, but nothing serious and nothing a neighbor can do, so the site does not become a crime list.
  - id: police-outside-same-named-street
    stage: curate
    tags: [police, safety, bar, place]
    input:
      sourceId: madison-police-incident-reports
      externalId: madison-police-incident-reports:https://www.cityofmadison.com/police/incident-reports/2026-11-20/shots-fired
      contentHash: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      kind: news
      title: Shots fired on Cottage Grove Road
      sourceText: 5200 block Cottage Grove Rd, Officers found shell casings after a report of shots fired. No one was hurt.
      startsAt: null
      locationText: 5200 block Cottage Grove Rd
      change: new
    known: null
    expected: { decision: reject, coverage: outside, safety: true, route: none }
    graders:
      - { check: equals, field: $.decision, value: reject }
    why: Serious, but the boundary put the block outside, and the road's name does not change that.
  - id: police-update-to-known-incident
    stage: curate
    tags: [police, safety, update]
    input:
      sourceId: madison-police-incident-reports
      externalId: madison-police-incident-reports:https://www.cityofmadison.com/police/incident-reports/2026-11-19/armed-carjacking
      contentHash: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      kind: news
      title: Armed carjacking
      sourceText: 'UPDATE: Police have arrested a suspect and found the car. Officers responded to the original report after a caller said a car was taken at gunpoint.'
      startsAt: null
      locationText: null
      change: updated
    known:
      collection: posts
      id: 52
      externalId: 'madison-police-incident-reports:https://www.cityofmadison.com/police/incident-reports/2026-11-19/armed-carjacking'
      contentHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      status: active
    given:
      verification: { coverage: unknown, flags: [missing-location] }
    expected:
      {
        decision: update,
        coverage: unknown,
        safety: true,
        route: reportItem,
        targetCollection: posts,
        targetId: 52,
      }
    graders:
      - { check: equals, field: $.decision, value: update }
      - { check: equals, field: $.targetId, value: 52 }
    why: As the live feed gives an update, with the description replaced by "UPDATE:" and no place. The place is the known item's, so it is an update with the resolution first, never rejected as having no place.
  - id: police-update-names-arrested-adult
    stage: curate
    tags: [police, safety, update, private-person]
    input:
      sourceId: madison-police-incident-reports
      externalId: madison-police-incident-reports:https://www.cityofmadison.com/police/incident-reports/2026-11-19/armed-carjacking
      contentHash: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      kind: news
      title: Armed carjacking
      sourceText: 'UPDATE: Detectives arrested Jordan Example, 34, of Madison, on a charge of armed robbery. He is held in the Dane County Jail.'
      startsAt: null
      locationText: null
      change: updated
    known:
      collection: posts
      id: 52
      externalId: 'madison-police-incident-reports:https://www.cityofmadison.com/police/incident-reports/2026-11-19/armed-carjacking'
      contentHash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      status: active
    expected:
      {
        decision: update,
        coverage: unknown,
        safety: true,
        route: reportItem,
        targetCollection: posts,
        targetId: 52,
      }
    graders:
      - { check: equals, field: $.decision, value: update }
      - { check: notContains, field: $.reasons, value: Jordan }
      - check: model
        rubric: >-
          The reasons say an arrest was reported and that an arrest or a charge is not guilt. They
          name no one, not the arrested person, and give no age, town or jail.
    why: A private person's name, age and charge are in the report, and an arrest is not guilt, so the reasons and any draft leave the person out.
  - id: police-page-could-not-be-read
    stage: curate
    tags: [police, safety, bar, place]
    input:
      sourceId: madison-police-incident-reports
      externalId: madison-police-incident-reports:https://www.cityofmadison.com/police/incident-reports/2026-11-21/shots-fired
      contentHash: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      kind: news
      title: MPD investigates shots fired incident on east side
      sourceText: Officers are investigating a report of shots fired on the east side.
      startsAt: null
      locationText: null
      change: new
    known: null
    given:
      verification:
        coverage: unknown
        confidence: 0.3
        flags: [missing-location]
        coverageReason: The report page could not be read, so whether the report names a place is not known.
        unknowns: [location, address]
    expected: { decision: needs-review, coverage: unknown, safety: true, route: reportItem }
    graders:
      - { check: equals, field: $.decision, value: needs-review }
    why: Verify could not read the report's page, so it does not know whether the report has a place. Nothing is known, so a person looks; it is never rejected as not here.
  - id: police-page-read-and-names-no-place
    stage: curate
    tags: [police, safety, bar, place]
    input:
      sourceId: madison-police-incident-reports
      externalId: madison-police-incident-reports:https://www.cityofmadison.com/police/incident-reports/2026-11-21/missing-teen
      contentHash: 'a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9a9'
      kind: news
      title: Police ask for help finding a missing teen
      sourceText: Police ask the public for help finding a teen last seen walking home from school on Tuesday.
      startsAt: null
      locationText: null
      change: new
    known: null
    given:
      verification:
        coverage: unknown
        confidence: 0.8
        flags: [missing-location]
        coverageReason: The report page was read and names no place, so nothing says it is here.
        unknowns: [location, address]
    expected: { decision: reject, coverage: unknown, safety: true, route: none }
    graders:
      - { check: equals, field: $.decision, value: reject }
    why: The twin of the unreadable page, with the same flag and unknowns but a reason that says the page was read. A report that names no place is not here, so it is rejected; the reason is what tells the two apart.
