# Verify eval cases for the place check (#1009): the boundary test and the word match. The model
# answers the tier; code then writes `placement` (runner/lib/place.mjs) after verify, from the City's
# address locator and the boundary. The collector (#272) must run place.mjs on the model's answer with
# a recorded locator answer before it grades a `placement` field, and never ask the model to write it.
# Synthetic items.
version: 1
asOf: '2026-11-24'
stage: verify
cases:
  - id: verify-place-by-boundary-inside
    stage: verify
    tags: [place, boundary]
    input:
      sourceId: district16-blog
      title: Alder's neighborhood meeting at the Door Creek Park shelter
      sourceText: The alder meets neighbors at the shelter, with the date, time and address on the district page.
      startsAt: 2026-11-14T10:00:00-06:00
      locationText: Door Creek Park Shelter, 7035 Littlemore Dr, Madison, WI
    expected:
      {
        decision: accept,
        coverage: core,
        flagsAbsent: [ambiguous-location],
        route: submitSuggestion,
        placement: boundary,
      }
    graders:
      - { check: equals, field: $.placement.method, value: boundary }
      - { check: equals, field: $.placement.inside, value: true }
    why: A public address in the area, resolved by the City's locator and inside the City's boundary, so the item is core by the boundary.
  - id: verify-place-by-boundary-outside-named-road
    stage: verify
    tags: [place, boundary]
    input:
      sourceId: madison365-news
      title: Community meal at Messiah Lutheran Church
      sourceText: A weekly meal open to everyone, at the church's address on Cottage Grove Road.
      startsAt: 2026-11-14T17:00:00-06:00
      locationText: Messiah Lutheran Church, 5202 Cottage Grove Rd, Madison, WI
    expected: { decision: reject, coverage: outside, route: none, placement: boundary }
    graders:
      - { check: equals, field: $.placement.method, value: boundary }
      - { check: equals, field: $.placement.inside, value: false }
      - { check: notMatches, field: $.coverage, value: '^core$' }
    why: Cottage Grove Road bounds the area, but this address is two kilometers west of it. The word match names the road; the boundary puts the address outside, and core is never kept.
  - id: verify-place-without-address-by-word-match
    stage: verify
    tags: [place, boundary]
    input:
      sourceId: district16-blog
      title: Alder's office hours on Sprecher Road
      sourceText: Office hours at a coffee shop on Sprecher Road, with no street number given.
      startsAt: 2026-11-12T08:00:00-06:00
      locationText: A coffee shop on Sprecher Road, Madison, WI
    expected:
      {
        decision: needs-review,
        coverage: unknown,
        flags: [missing-location],
        route: reportItem,
        placement: word-match,
      }
    graders:
      - { check: equals, field: $.placement.method, value: word-match }
      - { check: isNull, field: $.placement.inside }
    why: No street number, so nothing to test against the boundary; the word match stands and the item says so. Never guess the shop.
  - id: verify-place-park-named-without-address
    stage: verify
    tags: [place, boundary]
    input:
      sourceId: madison365-news
      title: Leaf-raking morning at Door Creek Park
      sourceText: Volunteers meet in the park on Saturday morning. No street address is given.
      startsAt: 2026-11-21T10:00:00-06:00
      locationText: Door Creek Park
    expected:
      {
        decision: accept,
        coverage: core,
        flagsAbsent: [ambiguous-location],
        route: submitSuggestion,
        placement: word-match,
      }
    graders:
      - { check: equals, field: $.placement.method, value: word-match }
    why: The shelter and the northern part of the park are inside the area (coverage.md), and the files can't split the park by name, so naming it alone stays core and an editor reads the place; with no street address the word match stands and says so.
  - id: verify-place-park-south-access-outside
    stage: verify
    tags: [place, boundary]
    input:
      sourceId: madison365-news
      title: Open house at the Door Creek Park south entrance
      sourceText: The City invites neighbors to see the trail work at the park's Cottage Grove Road entrance, with the address on the park page.
      startsAt: 2026-12-05T10:00:00-06:00
      locationText: Door Creek Park, 7202 Cottage Grove Rd, Madison, WI
    expected:
      { decision: accept, coverage: catchment, route: submitSuggestion, placement: boundary }
    graders:
      - { check: equals, field: $.placement.method, value: boundary }
      - { check: equals, field: $.placement.inside, value: false }
      - { check: notMatches, field: $.coverage, value: '^core$' }
    why: The park's southern end is outside the City's boundary, so an address there is not core even though the park is named; it is a place next door that residents use, so catchment.
