      kind: news
      title: Highway T Closure at Felland Road Begins October 26
      sourceText: >-
        On Monday, October 26, starting at 9:00am, Capitol Underground will close County Hwy T in both
        directions east of the intersection with Felland Road to complete utility work for a private
        development contract. The closure will be in place until Friday October 30th at 3pm. The detour
        route will use Sprecher Road, Milwaukee Street, and N Thompson Drive.
      startsAt: null
      locationText: null
      sourceStatus: unknown
    expected: { decision: accept, coverage: catchment, route: submitSuggestion }
    graders:
      - check: model
        rubric: >-
          The result says the closed road (County Highway T east of Felland Road) is outside the area,
          that the detour runs over Sprecher Road and Milwaukee Street, which bound the area, and gives
          both dates from the post: Monday October 26 at 9:00 am to Friday October 30 at 3:00 pm.
    why: >-
      The real County Highway T closure of 2026-10-19, which the site missed. The coverage comes from
      the detour, not the closed road, and the dates are on the post's page.
