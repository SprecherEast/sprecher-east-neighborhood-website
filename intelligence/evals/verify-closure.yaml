# Verify eval cases for road closure and traffic change posts (#994): the closed road and the
# detour are two different places, and verify reads both from the post's own page, because the
# City's list cuts each post off before its detour. Synthetic unless `why` names a real post.
# Offsets are America/Chicago (CDT -05:00 until 2026-11-01 02:00).
version: 1
asOf: '2026-10-24'
stage: verify
cases:
