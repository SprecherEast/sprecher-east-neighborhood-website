# The words code uses to tell that an item is about the area (#390). One list for every rule that
# matches text; coverage.md says what the area is, and the model stages get this file with it.
# Lowercase. Each word or phrase matches whole words only ("pinney" doesn't match "pinneyville").
# Change it only through a PR.
version: 1
# In or bounding the area (coverage.md, "The area" and "Tiers").
places:
  - sprecher
  - door creek
  - cottage grove road
  - cottage grove rd
  - district 16
  - pinney
  - elvehjem
  - blooming grove
  - reston heights
  - owl creek
# The immediately neighboring associations, from the City's Neighborhood Associations map layer
# (official). Measured on 2026-10-25 with the layer's own query, buffering Sprecher East's polygon
# (NA_ID 146): North Star touches it (within 50 m); Richmond Hill Homeowners is within 500 m.
# Nothing else is within 800 m; at 1 km only High Crossing, which the layer marks inactive. Their major
# events and public matters are catchment (coverage.md).
neighbors:
  source: https://maps.cityofmadison.com/arcgis/rest/services/Public/OPEN_DATA/MapServer/12
  checked: '2026-10-25'
  names:
    - north star
    - richmond hill
# The City's own boundary for the neighborhood (#1009). The runner tests an item's street address
# against it after verify and records the method on `verification.placement`; an item with no
# address resolved keeps the word match above (runner/lib/place.mjs, coverage.md "Review passes").
# Verified by hand on 2026-11-24 against the City's Neighborhood Associations layer: Sprecher East
# is the one feature whose NA_ID is 146 (layer name "Sprecher East", status Active, classification
# Neighborhood Association). The City says the layer's boundaries are self-reported by the
# associations, not determined by the City; its terms are the City's data policy (informational,
# no reuse restriction stated). The polygon is kept as a dated copy in boundary.json (a small file,
# 89 points, about 3 km2) so a run needs no request for it; `node run.mjs --refresh-boundary`
# rewrites it, and a run reports a copy older than `maxAgeDays`. A geocoded point on the edge
# counts as inside. Coordinates are kept in boundary.json only.
boundary:
  source: https://maps.cityofmadison.com/arcgis/rest/services/Public/OPEN_DATA/MapServer/12
  field: NA_ID
  naId: 146
  file: boundary.json
  maxAgeDays: 365
  terms: https://www.cityofmadison.com/policy/data
  checked: '2026-11-24'
  verified: true
  # The City's own address locator: official, no key, no cost. Only a street address is sent.
  geocoder:
    source: https://maps.cityofmadison.com/arcgis/rest/services/Locators/AddressPoints_w_Unit/GeocodeServer
    minScore: 90
    sameSpotMeters: 30
    maxPerRun: 30
    timeoutSeconds: 10
    maxKilobytes: 100
# A highway alone names half the city. It counts only when the same item also names one of `with`:
# an interchange or a cross street at the area's edge.
highways:
  - names:
      [
        i-94,
        i 94,
        i94,
        interstate 94,
        interstate highway 94,
        i-90/94,
        i-39/90/94,
        highway 94,
        hwy 94,
      ]
    # sprecher road is already a place word
    with: [interchange, milwaukee street, milwaukee st]
