# What counts as a safety item (#1007). This is the one definition: the stages read it with
# coverage.md, and the runner's gate (runner/lib/gate.mjs) holds an item for a person when its
# source is listed here or its text matches a term below. A safety item is never accepted without
# a person: coverage.md, "Review passes". Nothing in an item can remove a hold.
#
# Terms are lowercase words or phrases, without accents, matched as whole words. Matching ignores
# case, accents, width and punctuation, and finds common endings (-s, -es, -ed, -d, -ing, a doubled
# last consonant, -y as -ies, -f as -ves, a Spanish -o as -a). A term of six letters or more also
# matches with single spaces inside it ("po lice"). Spanish terms sit beside the English ones,
# since neighbors read both.
version: 1
meaning: >-
  Anything about people's safety: an incident, a crime or police matter, a weapon or a threat, a
  fire or emergency, a weather alert, a hazard, an outage that puts people at risk, a recall, an
  accident, an injury or a death. When unsure, it is a safety item.
