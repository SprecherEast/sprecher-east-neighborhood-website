    notes: >-
      Hand check #994, 2026-11-26: the live service is Public/OPEN_DATA_TE layer 14 (the same data
      sits in Traffic/Road_Closures, layer 4). Fields: Start_Date, End_Date, Closure_Type (Full,
      Partial, Special Event), Comments, Contact, Road_Closed, Text_SDate, Text_EDate and a
