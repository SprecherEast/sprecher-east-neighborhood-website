    cadence: daily
    lastChecked: '2026-11-26'
    result: valid
    pilotRank: 15
    robots: *cityRobotsNov26
    treatment: >-
      Posts from the last 14 days, all kept: the list cuts each post off before its detour, so a
      closure outside the area can still send traffic over Sprecher Road or Milwaukee Street and
      the list text can't show it. Verify reads the post's own page for the closed road, the
      detour and the start and end dates, never guessing a date; curate rejects a closure
      elsewhere in the city (coverage.md). The post is a lead: the City's dates stand, and an
      ended closure is rejected as past.
    example:
      title: Highway T Closure at Felland Road Begins October 26
      date: '2026-10-19'
      url: https://www.cityofmadison.com/news/2026-10-19/highway-t-closure-at-felland-road-begins-october-26
    notes: >-
      Hand check #994, 2026-11-26: 200 text/html with the list in the markup; robots.txt allows
      /news (it names only /search, /admin, /user and file paths). The Mobility & Infrastructure
      news page (`/traffic-engineering/news` redirects to `/mobility/news`) lists the same posts
      but answered 403 once the category was added, so the City news list is the one read. No feed
      link on either page (/news/feed and /mobility/news/feed answer 404). A post gives the
      closed road, the dates, the contractor and a detour map; the Highway T post
      (2026-10-19) names the detour over Sprecher Road, Milwaukee Street and N Thompson Drive on its
      page only. An official email alert exists: the City's email lists (cityofmadison.com/contact/email-lists)
      include Transportation, Road Construction and Blooming Grove; it needs an address, so it is the owner's to
      subscribe to, and the daily read does not depend on it.
