  - id: madison-police-incident-reports
    name: 'Madison Police incident reports feed'
    owner: 'City of Madison Police Department'
    canonicalUrl: https://www.cityofmadison.com/police/incident-reports
    feedUrl: https://www.cityofmadison.com/feed/incident-reports
    format: rss
    scope: 'Incident reports, with the block address only in the description'
    audiences: [everyone]
    reliability: official
    access: 'Public feed on a path robots.txt allows (checked 2026-11-25); the City says its website data is public and generally available to copy or distribute, logos and images excepted. Read once a day, logged out; the report pages are never fetched in bulk.'
    cadence: daily
    lastChecked: '2026-11-25'
    result: valid
    pilotRank: 9
    robots:
      { checked: '2026-11-25', result: allowed, url: https://www.cityofmadison.com/robots.txt }
    treatment: >-
      Always a safety item: coverage.md, "Review passes", and safety.yaml hold every item for a person,
      never a suggestion. The block address is read from the start of the description (the parser, #993);
      the City's boundary places it, never a word in the title. The report's page is the item's id, so a
      changed report is an update to a known item. A feed item is only a lead: the runner reads the report
      page once and gives its text to verify (`reportPage`; the models have no tools), which uses it
      and the tip line it gives, and no number or detail the report does not give is stated.
    example:
      title: Armed Carjacking
      date: '2026-11-20'
      url: https://www.cityofmadison.com/police/incident-reports/2026-11-19/armed-carjacking
    notes: 'Hand check 2026-11-25 (#993): RSS 2.0 with a guid, link and pubDate on every item and no ttl or lastBuildDate; the guid ends in the time of the last update, so the page link is the id. The City posts a few reports a week; one daily read is enough. Each report page gives the incident type, a case id, the block address, an approximate map point and when it was last updated. Of 81 items, 46 begin with a block, 21 with an intersection or a street and 14 with UPDATE and no place.'
  - id: city-traffic-engineering-news
    name: 'City of Madison street and lane closure news'
    owner: 'City of Madison Mobility & Infrastructure (formerly Traffic Engineering)'
    canonicalUrl: https://www.cityofmadison.com/news?category=1031
    feedUrl: null
    format: html
    scope: 'Street and lane closures, detours and traffic changes: the City news list filtered to its Street & Lane Closures category'
    audiences: [everyone]
    reliability: official
